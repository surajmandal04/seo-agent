<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEO Agent</title>
<style>
  /* Black theme, always (whatever the Mac's light/dark setting) */
  :root {
    color-scheme: dark;  /* dark scrollbars, dropdowns and form controls too */
    --bg: #0a0b0d; --surface: #15171b; --border: #2a2e35; --text: #e7e9ec;
    --muted: #9aa3ae; --accent: #748ffc; --accent-text: #0d1020; --accent-soft: #1f2540;
    --ok: #69db7c; --err: #ff8787; --err-soft: #2a1717; --code: #22252b;
    --chart: #6a85f2;  /* score line; validated vs this black surface */
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 24px; color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .card + .card { margin-top: 16px; }
  label.field { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }

  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .grow { flex: 1 1 320px; }
  textarea { resize: vertical; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type=number] { width: 90px; }

  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--bg); color: var(--muted); padding: 10px 14px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  button.primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
                   padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .55; cursor: wait; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; }

  .status-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .status-head h2 { margin: 0; font-size: 16px; }
  .timer { color: var(--muted); font-variant-numeric: tabular-nums; }
  ol.steps { margin: 12px 0 0; padding: 0; list-style: none; }
  ol.steps li { padding: 4px 0; display: flex; gap: 8px; }
  ol.steps li::before { content: "✓"; color: var(--ok); font-weight: 700; }
  ol.steps li.current::before { content: "●"; color: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .error { background: var(--err-soft); color: var(--err); border-radius: 8px; padding: 12px; margin-top: 12px;
           white-space: pre-wrap; word-break: break-word; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 16px; margin-top: 16px; align-items: start; }
  .layout main { min-width: 0; }  /* lets wide tables scroll inside instead of stretching the page */
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  aside h3 { margin: 0 0 8px; font-size: 14px; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li button { width: 100%; text-align: left; background: none; border: 0; color: var(--accent);
                    padding: 6px 0; font: inherit; cursor: pointer; word-break: break-all; }
  aside li small { display: block; color: var(--muted); }

  /* Rendered report */
  .report h1 { font-size: 22px; margin-top: 0; }
  .report h2 { font-size: 18px; margin-top: 28px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .report table { display: block; overflow-x: auto; border-collapse: collapse; margin: 12px 0; font-size: 14px; }
  .report th, .report td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  .report th { background: var(--bg); }
  .report code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 13px; word-break: break-word; }
  .report pre { background: var(--code); padding: 12px; border-radius: 8px; overflow-x: auto; }
  .report pre code { padding: 0; }
  .report a { color: var(--accent); }
  .empty { color: var(--muted); }
  .hidden { display: none !important; }

  /* Score history */
  aside .card + .card { margin-top: 16px; }
  .chg { font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 4px; }
  .chg.up { color: var(--ok); } .chg.down { color: var(--err); } .chg.flat { color: var(--muted); }
  .hist-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .hist-head h2 { margin: 0 0 2px; font-size: 18px; word-break: break-all; }
  .hist-head p { margin: 0; color: var(--muted); font-size: 13px; }
  .hero { display: flex; align-items: baseline; gap: 8px; margin: 16px 0 4px; }
  .hero .num { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .hero .of { color: var(--muted); }
  button.secondary { background: none; border: 1px solid var(--border); color: var(--text); border-radius: 8px;
                     padding: 8px 14px; font: inherit; cursor: pointer; }
  .chart-wrap { position: relative; margin: 8px 0 16px; }
  .chart-wrap svg { display: block; width: 100%; height: 220px; overflow: visible; }
  .chart-wrap .grid { stroke: var(--border); stroke-width: 1; }
  .chart-wrap .axis-label { fill: var(--muted); font-size: 11px; }
  .chart-wrap .line { fill: none; stroke: var(--chart); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart-wrap .area { fill: var(--chart); opacity: .1; }
  .chart-wrap .dot { fill: var(--chart); stroke: var(--surface); stroke-width: 2; }
  .chart-wrap .end-label { fill: var(--text); font-size: 12px; font-weight: 600; }
  .chart-wrap .cross { stroke: var(--muted); stroke-width: 1; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
         border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.12);
         white-space: nowrap; transform: translate(-50%, -110%); }
  .tip small { display: block; color: var(--muted); }
  table.runs { border-collapse: collapse; font-size: 13px; width: 100%; display: block; overflow-x: auto; }
  table.runs th, table.runs td { border-bottom: 1px solid var(--border); padding: 6px 10px; text-align: right; white-space: nowrap; }
  table.runs th:first-child, table.runs td:first-child { text-align: left; }
  table.runs th { color: var(--muted); font-weight: 600; }
  .deductions { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SEO Agent</h1>
    <p>Paste a website address. The AI agent checks it for SEO problems and writes fixes.</p>
  </header>

  <form class="card" id="form">
    <div class="row">
      <div class="grow">
        <label class="field" for="url" id="targetLabel">Website address</label>
        <input type="text" id="url" placeholder="https://yoursite.com" required autocomplete="off">
      </div>
      <div>
        <label class="field">What to do</label>
        <div class="seg" role="group">
          <button type="button" data-mode="page" class="on">One page</button>
          <button type="button" data-mode="site">Whole site</button>
          <button type="button" data-mode="keywords">Keywords</button>
          <button type="button" data-mode="article">Article</button>
          <button type="button" data-mode="compare">Compare</button>
          <button type="button" data-mode="gsc">Search Console</button>
        </div>
      </div>
      <div id="lengthBox" class="hidden">
        <label class="field" for="length">Length</label>
        <select id="length">
          <option value="800">Short (~800 words)</option>
          <option value="1200" selected>Medium (~1,200)</option>
          <option value="2000">Long (~2,000)</option>
        </select>
      </div>
      <div id="toneBox" class="hidden">
        <label class="field" for="tone">Tone</label>
        <select id="tone">
          <option>friendly and expert</option>
          <option>professional</option>
          <option>casual and fun</option>
          <option>simple, for beginners</option>
        </select>
      </div>
      <div id="pagesBox" class="hidden">
        <label class="field" for="pages">Pages</label>
        <input type="number" id="pages" value="30" min="1" max="100">
      </div>
      <div id="countryBox" class="hidden">
        <label class="field" for="country">Country</label>
        <select id="country">
          <option value="us">United States</option>
          <option value="gb">United Kingdom</option>
          <option value="in">India</option>
          <option value="ca">Canada</option>
          <option value="au">Australia</option>
        </select>
      </div>
      <div>
        <label class="field" for="engine">AI engine</label>
        <select id="engine">
          <option value="free">Claude Code (free)</option>
          <option value="api">Claude API (uses credit)</option>
        </select>
      </div>
      <button class="primary" id="go" type="submit">Audit</button>
    </div>
    <div class="row hidden" id="siteBox" style="margin-top:12px">
      <div class="grow">
        <label class="field" for="site" id="siteLabel">Your website (optional — finds keyword gaps)</label>
        <input type="text" id="site" placeholder="https://yoursite.com" autocomplete="off">
      </div>
    </div>
    <div class="row hidden" id="compareBox" style="margin-top:12px">
      <div class="grow">
        <label class="field" for="competitors">Competitor pages (1–3, one per line)</label>
        <textarea id="competitors" rows="3" placeholder="https://competitor.com/their-page"></textarea>
      </div>
      <div style="flex: 0 1 260px">
        <label class="field" for="keyword">Target keyword (optional)</label>
        <input type="text" id="keyword" placeholder="e.g. coffee grinder" autocomplete="off">
      </div>
    </div>
    <div class="hint" id="hint">One page takes about 1 minute.</div>
  </form>

  <div class="layout">
    <main>
      <section class="card hidden" id="statusCard">
        <div class="status-head">
          <h2 id="statusTitle">Working…</h2>
          <span class="timer" id="timer">0s</span>
        </div>
        <ol class="steps" id="steps"></ol>
        <div class="error hidden" id="error"></div>
      </section>
      <section class="card report" id="report">
        <p class="empty">Your report will appear here.</p>
      </section>
    </main>
    <aside>
      <div class="card">
        <h3>Score history</h3>
        <ul id="tracked"><li class="empty">Run an audit to start tracking</li></ul>
      </div>
      <div class="card">
        <h3>Past reports</h3>
        <ul id="history"><li class="empty">None yet</li></ul>
      </div>
    </aside>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let mode = "page", pollTimer = null;
let view = 0;  // bumps whenever the main panel changes, so slow responses can't overwrite newer content

// One page / Whole site / Keywords toggle
const MODES = {
  page:     { label: "Website address", placeholder: "https://yoursite.com", button: "Audit",
              hint: "One page takes about 1 minute." },
  site:     { label: "Website address", placeholder: "https://yoursite.com", button: "Audit",
              hint: "A 30-page crawl takes about 2–3 minutes. 100 pages takes longer." },
  keywords: { label: "Seed keyword", placeholder: "e.g. coffee grinder", button: "Research",
              hint: "Uses free search suggestions from Google, Bing and DuckDuckGo. " +
                    "Shows popularity estimates, not exact search volumes. Takes about 1–2 minutes." },
  article:  { label: "Target keyword", placeholder: "e.g. coffee grinder for french press", button: "Write",
              hint: "Researches related keywords, writes a draft, checks it for SEO and readability, " +
                    "then fixes the issues. Takes about 2–4 minutes. Facts to verify are marked [VERIFY]." },
  compare:  { label: "Your page", placeholder: "https://yoursite.com/your-page", button: "Compare",
              hint: "Puts your page next to competitor pages and finds topics they cover that you don't. " +
                    "Takes about 1–2 minutes." },
  gsc:      { label: "Your site (verified in Search Console)", placeholder: "https://yoursite.com",
              button: "Analyse", hint: "Your real Google data for the last 28 days: searches, clicks, positions " +
                                        "and quick wins. Checking setup…" },
};

// Re-check setup whenever you come back to this tab, so a finished setup clears the message
window.addEventListener("focus", () => { if (mode === "gsc") gscHint(); });

// Search Console needs a one-time sign-in; show where setup stands
async function gscHint() {
  const s = await (await fetch("/api/gsc/status")).json();
  if (mode !== "gsc") return;
  $("hint").textContent = s.logged_in
    ? "Signed in to Search Console (read-only). Your real Google data for the last 28 days."
    : !s.client_secret_found
      ? "Setup needed: put the Google OAuth file at data/gsc_client_secret.json, then run “.venv/bin/python gsc.py login”."
      : "Almost there: run “.venv/bin/python gsc.py login” in the seo-agent folder to sign in with Google.";
}
document.querySelectorAll(".seg button").forEach((btn) => {
  btn.onclick = () => {
    mode = btn.dataset.mode;
    const m = MODES[mode];
    document.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("on", b === btn));
    $("pagesBox").classList.toggle("hidden", mode !== "site");
    const wordMode = mode === "keywords" || mode === "article";
    $("countryBox").classList.toggle("hidden", !wordMode);
    $("siteBox").classList.toggle("hidden", !wordMode);
    $("lengthBox").classList.toggle("hidden", mode !== "article");
    $("toneBox").classList.toggle("hidden", mode !== "article");
    $("compareBox").classList.toggle("hidden", mode !== "compare");
    $("siteLabel").textContent = mode === "article"
      ? "Your website (optional — matches the article to your business)"
      : "Your website (optional — finds keyword gaps)";
    $("targetLabel").textContent = m.label;
    $("url").placeholder = m.placeholder;
    $("go").textContent = m.button;
    $("hint").textContent = m.hint;
    if (mode === "gsc") gscHint();
  };
});

// Start an audit
$("form").onsubmit = async (e) => {
  e.preventDefault();
  view++;
  $("go").disabled = true;
  $("statusCard").classList.remove("hidden");
  $("statusTitle").textContent = "Working…";
  $("steps").innerHTML = '<li class="current">Starting the agent</li>';
  $("error").classList.add("hidden");
  $("report").innerHTML = '<p class="empty">The agent is working. The report will appear here.</p>';

  try {
    const res = await fetch("/api/audit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        target: $("url").value, mode, engine: $("engine").value,
        max_pages: Number($("pages").value) || 30,
        country: $("country").value,
        site: (mode === "keywords" || mode === "article") ? $("site").value || null : null,
        length: Number($("length").value), tone: $("tone").value,
        competitors: mode === "compare" ? $("competitors").value.split(/\s+/).filter(Boolean).slice(0, 3) : [],
        keyword: mode === "compare" ? $("keyword").value : "",
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(Array.isArray(data.detail) ? data.detail[0].msg : data.detail || "Request failed");
    poll(data.job_id);
  } catch (err) {
    showError(err.message);
  }
};

// Ask the server for progress every 2 seconds
function poll(jobId) {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    const res = await fetch(`/api/jobs/${jobId}`);
    const job = await res.json();
    if (!res.ok) { clearInterval(pollTimer); return showError(job.detail); }

    $("timer").textContent = `${job.elapsed}s`;
    const steps = ["Starting the agent", ...job.progress];
    if (job.status === "running") steps.push("Thinking…");
    $("steps").innerHTML = "";
    steps.forEach((text, i) => {
      const li = document.createElement("li");
      li.textContent = text;  // textContent, not innerHTML: never run text as HTML
      if (job.status === "running" && i === steps.length - 1) li.className = "current";
      $("steps").appendChild(li);
    });

    if (job.status === "done") {
      clearInterval(pollTimer);
      $("statusTitle").textContent = `Done — saved as ${job.saved_as}`;
      $("report").innerHTML = job.html;  // server renders Markdown with raw HTML disabled
      addPdfButton(job.saved_as);
      $("go").disabled = false;
      loadHistory();
      loadTracked();
    } else if (job.status === "error") {
      clearInterval(pollTimer);
      showError(job.error);
    }
  }, 2000);
}

function showError(msg) {
  $("statusTitle").textContent = "Something went wrong";
  $("error").textContent = msg;
  $("error").classList.remove("hidden");
  $("steps").querySelector(".current")?.classList.remove("current");
  $("go").disabled = false;
}

// "Download PDF" link at the top of a shown report (server makes it with headless Chrome)
function addPdfButton(name) {
  const bar = document.createElement("div");
  bar.style.cssText = "display:flex; justify-content:flex-end; margin-bottom:8px";
  const a = document.createElement("a");
  a.className = "secondary";
  a.style.cssText = "text-decoration:none; border:1px solid var(--border); border-radius:8px; padding:6px 12px; color:var(--text); font-size:14px";
  a.href = `/api/reports/${encodeURIComponent(name)}/pdf`;
  a.textContent = "⬇ Download PDF";
  bar.appendChild(a);
  $("report").prepend(bar);
}

// Past reports sidebar
async function loadHistory() {
  const list = await (await fetch("/api/reports")).json();
  const ul = $("history");
  ul.innerHTML = "";
  if (!list.length) { ul.innerHTML = '<li class="empty">None yet</li>'; return; }
  list.forEach((r) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.textContent = r.name.replace(/\.md$/, "");
    const when = document.createElement("small");
    when.textContent = new Date(r.modified * 1000).toLocaleString();
    btn.appendChild(when);
    btn.onclick = async () => {
      if ($("go").disabled) return;  // an audit is running; don't hide its progress
      const myView = ++view;
      const data = await (await fetch(`/api/reports/${encodeURIComponent(r.name)}`)).json();
      if (myView !== view) return;   // something newer was shown meanwhile
      $("report").innerHTML = data.html;
      addPdfButton(r.name);
      $("statusCard").classList.add("hidden");
    };
    li.appendChild(btn);
    ul.appendChild(li);
  });
}
loadHistory();

// ---------------------------------------------------------------------------
// Score history: every audit_page / crawl_site run is saved by the server with
// a score from a fixed formula, so the trend reflects real changes on the site.
// ---------------------------------------------------------------------------
const fmtDate = (t) => new Date(t * 1000).toLocaleString(undefined,
  { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

function changeBadge(now, before) {
  const span = document.createElement("span");
  if (before == null) return span;
  const d = now - before;
  span.className = "chg " + (d > 0 ? "up" : d < 0 ? "down" : "flat");
  span.textContent = d > 0 ? `▲ +${d}` : d < 0 ? `▼ ${d}` : "= 0";  // arrow + sign, never color alone
  return span;
}

let watches = [], nextRun = null;  // weekly re-audit watchlist from the server

async function loadTracked() {
  const w = await (await fetch("/api/watches")).json();
  watches = w.watches; nextRun = w.next_run;
  const list = await (await fetch("/api/history")).json();
  const ul = $("tracked");
  ul.innerHTML = "";
  if (!list.length) { ul.innerHTML = '<li class="empty">Run an audit to start tracking</li>'; return; }
  list.forEach((t) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.append(`${t.target.replace(/^https?:\/\//, "")} · ${t.latest_score}`);
    btn.appendChild(changeBadge(t.latest_score, t.previous_score));
    const sub = document.createElement("small");
    const watched = watches.some((w) => w.mode === t.mode && w.target === t.target);
    sub.textContent = `${MODE_NAMES[t.mode] || t.mode} · ${t.runs} run${t.runs > 1 ? "s" : ""}` +
                      (watched ? " · ⟳ weekly" : "");
    btn.appendChild(sub);
    btn.onclick = () => { if (!$("go").disabled) showHistory(t.mode, t.target); };
    li.appendChild(btn);
    ul.appendChild(li);
  });
}

const COLUMNS = {
  page: [["word_count", "Words"], ["images_missing_alt_count", "Missing alt"],
         ["title_length", "Title len"], ["meta_description_length", "Meta len"], ["h1_count", "H1s"]],
  site: [["pages_crawled", "Pages"], ["average_page_score", "Avg page"], ["broken_pages", "Broken"],
         ["images_missing_alt", "Missing alt"], ["title_too_long", "Long titles"],
         ["duplicate_titles", "Dup titles"], ["missing_meta_description", "No meta"]],
  speed: [["lcp_s", "LCP (s)"], ["fcp_s", "FCP (s)"], ["tbt_ms", "TBT (ms)"], ["cls", "CLS"]],
};
const MODE_NAMES = { page: "Page SEO", site: "Whole site", speed: "Mobile speed" };

async function showHistory(mode, target) {
  const myView = ++view;
  const runs = await (await fetch(`/api/history/runs?mode=${mode}&target=${encodeURIComponent(target)}`)).json();
  if (myView !== view) return;
  $("statusCard").classList.add("hidden");
  const panel = $("report");
  panel.innerHTML = "";

  const last = runs[runs.length - 1], prev = runs[runs.length - 2];
  const head = document.createElement("div");
  head.className = "hist-head";
  head.innerHTML = `<div><h2></h2><p></p></div>`;
  head.querySelector("h2").textContent = target.replace(/^https?:\/\//, "");
  head.querySelector("p").textContent =
    `${{ site: "Whole-site health score", page: "Single-page health score",
         speed: "Mobile performance score (Google PageSpeed)" }[mode]} · ${runs.length} run${runs.length > 1 ? "s" : ""}`;
  const again = document.createElement("button");
  again.className = "secondary";
  again.textContent = "Audit again";
  again.onclick = () => {  // a speed check is part of the page audit
    document.querySelector(`.seg button[data-mode="${mode === "speed" ? "page" : mode}"]`).click();
    $("url").value = mode === "site" ? `https://${target}` : target.replace(" (desktop)", "");
    $("form").requestSubmit();
  };
  const buttons = document.createElement("div");
  buttons.style.cssText = "display:flex; gap:8px; flex-wrap:wrap";
  buttons.appendChild(again);
  if (mode === "page" || mode === "site") buttons.appendChild(watchButton(mode, target));
  head.appendChild(buttons);
  panel.appendChild(head);

  const hero = document.createElement("div");
  hero.className = "hero";
  hero.innerHTML = `<span class="num"></span><span class="of">/ 100</span>`;
  hero.querySelector(".num").textContent = last.score;
  hero.appendChild(changeBadge(last.score, prev?.score));
  panel.appendChild(hero);

  if (last.metrics.deductions?.length) {
    const ul = document.createElement("ul");
    ul.className = "deductions";
    last.metrics.deductions.forEach((d) => { const li = document.createElement("li"); li.textContent = d; ul.appendChild(li); });
    panel.appendChild(ul);
  }

  const wrap = document.createElement("div");
  wrap.className = "chart-wrap";
  panel.appendChild(wrap);
  drawChart(wrap, runs);
  if (runs.length === 1) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Only one run so far. Audit again after making changes to see the trend.";
    panel.appendChild(p);
  }

  // Table view of every run (newest first) with change vs the run before
  const cols = COLUMNS[mode];
  const table = document.createElement("table");
  table.className = "runs";
  const hr = table.createTHead().insertRow();
  ["Date", "Score", ...cols.map((c) => c[1])].forEach((h) => { const th = document.createElement("th"); th.textContent = h; hr.appendChild(th); });
  const body = table.createTBody();
  [...runs].reverse().forEach((run, i, arr) => {
    const before = arr[i + 1];
    const tr = body.insertRow();
    tr.insertCell().textContent = fmtDate(run.created_at);
    const sc = tr.insertCell();
    sc.textContent = run.score;
    sc.appendChild(changeBadge(run.score, before?.score));
    cols.forEach(([key]) => { tr.insertCell().textContent = run.metrics[key] ?? "–"; });
  });
  const h3 = document.createElement("h3");
  h3.textContent = "All runs";
  h3.style.margin = "8px 0";
  panel.append(h3, table);
}

// "Watch weekly" toggle: adds/removes this page or site from the Monday 9:00 re-audits
function watchButton(mode, target) {
  const btn = document.createElement("button");
  btn.className = "secondary";
  const render = () => {
    const w = watches.find((w) => w.mode === mode && w.target === target);
    const next = nextRun ? new Date(nextRun).toLocaleString(undefined,
      { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
    btn.textContent = w ? "⟳ Watching weekly · Stop" : "⟳ Watch weekly";
    btn.title = w ? `Next automatic check: ${next}` : "Re-check automatically every Monday 9:00";
    btn.onclick = async () => {
      btn.disabled = true;
      if (w) {
        await fetch(`/api/watches/${w.id}`, { method: "DELETE" });
      } else {
        await fetch("/api/watches", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mode, url: mode === "site" ? `https://${target}` : target }) });
      }
      await loadTracked();
      btn.disabled = false;
      render();
    };
  };
  render();
  return btn;
}

// Line chart in plain SVG: 2px line, 10% area wash, dots with a surface ring,
// recessive gridlines, a label on the latest point, hover crosshair + tooltip.
function drawChart(wrap, runs) {
  const NS = "http://www.w3.org/2000/svg";
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    parent.appendChild(n);
    return n;
  };
  const render = () => {
    wrap.innerHTML = "";
    const W = wrap.clientWidth, H = 220, pad = { l: 34, r: 44, t: 12, b: 26 };
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img",
      "aria-label": `Health score over time, latest ${runs[runs.length - 1].score} out of 100` }, wrap);
    const t0 = runs[0].created_at, t1 = runs[runs.length - 1].created_at;
    const x = (t) => runs.length === 1 || t1 === t0 ? (pad.l + W - pad.r) / 2
                     : pad.l + ((t - t0) / (t1 - t0)) * (W - pad.l - pad.r);
    const y = (s) => pad.t + (1 - s / 100) * (H - pad.t - pad.b);

    [0, 25, 50, 75, 100].forEach((v) => {
      el("line", { x1: pad.l, x2: W - pad.r, y1: y(v), y2: y(v), class: "grid" }, svg);
      el("text", { x: pad.l - 8, y: y(v) + 4, "text-anchor": "end", class: "axis-label" }, svg).textContent = v;
    });
    const dateLabel = (t, anchor) =>
      el("text", { x: x(t), y: H - 6, "text-anchor": anchor, class: "axis-label" }, svg).textContent =
        new Date(t * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" });
    dateLabel(t0, runs.length === 1 ? "middle" : "start");
    if (runs.length > 1 && t1 !== t0) dateLabel(t1, "end");

    const pts = runs.map((r) => [x(r.created_at), y(r.score)]);
    if (pts.length > 1) {
      const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0]},${p[1]}`).join("");
      el("path", { d: `${d}L${pts[pts.length - 1][0]},${y(0)}L${pts[0][0]},${y(0)}Z`, class: "area" }, svg);
      el("path", { d, class: "line" }, svg);
    }
    const cross = el("line", { y1: pad.t, y2: y(0), class: "cross", visibility: "hidden" }, svg);
    pts.forEach((p) => el("circle", { cx: p[0], cy: p[1], r: 4, class: "dot" }, svg));
    const lp = pts[pts.length - 1];
    el("text", { x: lp[0] + 10, y: lp[1] + 4, class: "end-label" }, svg).textContent = runs[runs.length - 1].score;

    // Hover: the whole plot is the hit target; snap to the nearest run
    const tip = document.createElement("div");
    tip.className = "tip hidden";
    wrap.appendChild(tip);
    const hit = el("rect", { x: 0, y: 0, width: W, height: H, fill: "transparent" }, svg);
    hit.addEventListener("mousemove", (e) => {
      const mx = e.clientX - svg.getBoundingClientRect().left;
      let i = 0;
      pts.forEach((p, j) => { if (Math.abs(p[0] - mx) < Math.abs(pts[i][0] - mx)) i = j; });
      cross.setAttribute("x1", pts[i][0]); cross.setAttribute("x2", pts[i][0]);
      cross.setAttribute("visibility", "visible");
      const r = runs[i], before = runs[i - 1];
      tip.innerHTML = "";
      const strong = document.createElement("strong");
      strong.textContent = `Score ${r.score}`;
      tip.append(strong, changeBadge(r.score, before?.score));
      const small = document.createElement("small");
      small.textContent = fmtDate(r.created_at);
      tip.appendChild(small);
      tip.style.left = `${pts[i][0]}px`;
      tip.style.top = `${pts[i][1]}px`;
      tip.classList.remove("hidden");
    });
    hit.addEventListener("mouseleave", () => { tip.classList.add("hidden"); cross.setAttribute("visibility", "hidden"); });
  };
  render();
  new ResizeObserver(() => { if (wrap.isConnected) render(); }).observe(wrap);
}

loadTracked();
</script>
</body>
</html>
